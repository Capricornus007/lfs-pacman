# feed-bot 專用：目標機（AMD Ryzen 5 5600U，cpu family 25 / model 80，Zen 3）
# 的編譯旗標。CI 容器內 append 到 /etc/makepkg.conf；64 位與 -m32 的 32 位
# 共用同一組。新系統本機重建見 packages/pacman/makepkg.conf（同值）。
#
# 刻意不沿用 Arch 容器預設的 -Wp,-D_FORTIFY_SOURCE=3 / -Werror=format-security：
#   * _FORTIFY_SOURCE 會讓 glibc 自建 misc/syslog.c 的 always_inline syslog 失敗；
#   * -Werror=format-security 會打死 GCC 16.2 libcpp/expr.cc 與 expect 5.45.4。
# v2.25（2026-11-09 用戶定案）：-O3 + LTO 一併開，與本機 /etc/makepkg.conf
# 同設定（本機原本就是 znver3 -O3 + lto + LTOFLAGS=-flto=auto）。
# v2.30（2026-11-23 用戶鐵律：六最無豁免）：base toolchain（gcc/glibc/binutils/
# grub/openssl）對 LTO 最敏感 → 照樣全量開 LTO；任一包炸就修源頭（補 patch/
# 重命名衝突符號），**禁止單包降回 !lto、禁止白名單**。構建失敗即紅。
# v2.25 追加（2026-11-09）：-O4／-O5 在本機 GCC 16.2.1 實證與 -O3 產生
# 完全相同的組合語言（GCC 把 >3 視為 -O3），不另設等級。改上一批「不需
# profile 就有用」的激進開關；-Ofast 不上（會開 -ffinite-math-only／
# -funsafe-math-optimizations／-fassociative-math，破 IEEE 浮點語意）。
# 再往上是 PGO / AutoFDO / BOLT。PGO 已於 v2.26（2026-11-15 用戶定案）在 CI
# 全量落地：100 包無白名單，兩段式在 ci/build-recipe.sh 實作（pass1 插樁
# -fprofile-generate → ci/pgo-train.sh 限時訓練 → pass2 -fprofile-use）。
# AutoFDO／BOLT 為新系統裝好後的雲端疊加：本機僅 perf 錄製＋上傳 perf.data，
# 全部編譯在 GitHub Actions（公共倉庫標準 runner 免費）。見 docs/pgo-plan.md。

# ── v2.27（2026-11-20 使用者定案）：編譯旗標「六最」────────────────────
# 最新、最開發、最不穩定、最激進、最尖端、最貼合本機(znver3)，不管實驗性風險。
# 落地：① 版本線用最新（GCC 16.2 dev、linux-next 尖端、openssl/核心全部 latest dev）；
#       ② 下面 CFLAGS 已在 -O3 上疊滿 GCC 16 激進開關（Graphite/LTO/PGO/向量）；
#       ③ LTOFLAGS + 全量兩段 PGO 已開；④ AutoFDO/BOLT 列為雲端疊加（docs/pgo-plan.md）。
# 底線（不馬虎）：-Ofast/-ffinite-math-only/-funsafe-math-optimizations 不開——
#   它們破壞 IEEE 浮點，glibc libm/OpenSSL/GRUB 會算錯；這不是「風險」是「錯誤」。
CPPFLAGS=""
CFLAGS="-march=znver3 -mtune=znver3 -O3 -pipe -fstack-protector-strong -fno-plt \
-fipa-pta -fdevirtualize-at-ltrans -fno-semantic-interposition \
-fgraphite-identity -floop-nest-optimize -mprefer-vector-width=256"
CXXFLAGS="$CFLAGS"
LDFLAGS="-Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now"
LTOFLAGS="-flto=auto"
