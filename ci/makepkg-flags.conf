# feed-bot 專用：目標機（AMD Ryzen 5 5600U，cpu family 25 / model 80，Zen 3）
# 的編譯旗標。CI 容器內 append 到 /etc/makepkg.conf；64 位與 -m32 的 32 位
# 共用同一組。新系統本機重建見 packages/pacman/makepkg.conf（同值）。
#
# 刻意不沿用 Arch 容器預設的 -Wp,-D_FORTIFY_SOURCE=3 / -Werror=format-security：
#   * _FORTIFY_SOURCE 會讓 glibc 自建 misc/syslog.c 的 always_inline syslog 失敗；
#   * -Werror=format-security 會打死 GCC 16.2 libcpp/expr.cc 與 expect 5.45.4。
# v2.25（2026-11-09 用戶定案）：-O3 + LTO 一併開，與本機 /etc/makepkg.conf
# 同設定（本機原本就是 znver3 -O3 + lto + LTOFLAGS=-flto=auto）。
# 代價：base toolchain（gcc/glibc/binutils/grub/openssl）對 LTO 最敏感，
# 需用 only 定向驗證；任一包炸就單包降回 !lto，不拖垮其他 90 包。
CPPFLAGS=""
CFLAGS="-march=znver3 -mtune=znver3 -O3 -pipe -fstack-protector-strong -fno-plt"
CXXFLAGS="$CFLAGS"
LDFLAGS="-Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now"
LTOFLAGS="-flto=auto"
