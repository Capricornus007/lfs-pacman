name: feed-bot（掃描新版本 → CI 重建 → 入 feed，用戶端只需 pacman -Syu）
on:
  schedule:
    - cron: "30 1 * * *"   # 每日 09:30 UTC+8
  workflow_dispatch:
    inputs:
      force:
        description: "忽略偵測，全量重建 91 配方"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  scan-build-publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    timeout-minutes: 1440
    outputs:
      changed: ${{ steps.scan.outputs.changed }}
    steps:
      - name: 系統準備
        run: |
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          # MLFS 配方有 32 位步驟（gcc -m32）；Arch 容器預設沒開 multilib。
          sed -i '/^#\[multilib\]/,/^#Include = \/etc\/pacman.d\/mirrorlist/ s/^#//' /etc/pacman.conf
          pacman -Syu --noconfirm --needed base-devel git curl jq python python-pip meson ninja tcl rsync pacman-contrib github-cli lib32-glibc lib32-gcc-libs
          useradd -m builder
      - uses: actions/checkout@v4
      - name: 掃描上游新版本（HEAD 對照書表 URL 的目錄列表）
        id: scan
        run: |
          python3 ci/scan-updates.py ${{ inputs.force && '--all' || '' }} | tee /tmp/changed.txt
          echo "changed=$(wc -l < /tmp/changed.txt)" >> "$GITHUB_OUTPUT"
      - name: 逐配方構建（容器隔離＝取代 chroot）
        if: steps.scan.outputs.changed != '0'
        run: |
          # 排除 OBSOLETE，總數才是真正要建的 91 包
          : > /tmp/list
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            [ -f "packages/$name/OBSOLETE" ] && continue
            printf '%s\n' "$name" >> /tmp/list
          done < /tmp/changed.txt
          total=$(wc -l < /tmp/list)
          awk '{print NR"\t"$0}' /tmp/list > /tmp/list.indexed
          chmod +x ci/build-recipe.sh ci/scan-updates.py
          : > /tmp/results.tsv
          # xargs -n2 給每包 index/name；TOTAL 讓子殼顯示進度
          set +e
          TOTAL="$total" xargs -a /tmp/list.indexed -n2 -P2 bash -c '
            i=$1; name=$2
            echo "[$i/$TOTAL] START $name"
            ci/build-recipe.sh "$name"; rc=$?
            if [ $rc -eq 0 ]; then
              echo "[$i/$TOTAL] OK $name"
              printf "%s\tOK\t%s\n" "$i" "$name" >> /tmp/results.tsv
            else
              echo "[$i/$TOTAL] FAIL $name"
              printf "%s\tFAIL\t%s\n" "$i" "$name" >> /tmp/results.tsv
            fi
            exit $rc
          ' _
          rc=$?
          {
            echo "## feed-bot 進度"
            echo ""
            echo "total: **$total**  packages"
            echo ""
            echo "| # | result | package |"
            echo "|---|---|---|"
            sort -n /tmp/results.tsv | awk -F'\t' '{printf "| %s | %s | %s |\n",$1,$2,$3}'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DONE total=$total rc=$rc"
          exit $rc
      - name: 合併成 feed 併發佈 release
        if: steps.scan.outputs.changed != '0'
        run: |
          mkdir -p feed && cp packages/*/*.pkg.tar.zst feed/
          ( cd feed && LC_ALL=C makepkg --printsrcinfo > .SRCINFO 2>/dev/null || true )
          ( cd feed && repo-add mlfs-core.db.tar.zst *.pkg.tar.zst )
          sha256sum feed/*.pkg.tar.zst > feed/SHA256SUMS
          # release 不一定已存在；只 upload 會 404（2026-11-08 實錘：0 個 release）
          gh release view current-mlfs-repo >/dev/null 2>&1 || \
            gh release create current-mlfs-repo --title 'MLFS core feed' \
              --notes 'feed-bot 自動發佈（mlfs-core）' --latest=false
          gh release upload current-mlfs-repo feed/mlfs-core.db.tar.zst feed/*.pkg.tar.zst feed/SHA256SUMS --clobber
          gh release upload current-mlfs-repo feed/mlfs-core.files.tar.zst 2>/dev/null || true
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: 無變化
        if: steps.scan.outputs.changed == '0'
        run: echo "今日無上游新版本，不構建（省機器）"
