name: feed-bot（掃描新版本 → CI 重建 → 入 feed，用戶端只需 pacman -Syu）

on:
  schedule:
    - cron: "30 1 * * *"   # 每日 09:30 UTC+8
  push:
    branches: [master]     # 推到 master 即觸發掃描/重建（公共倉庫免費分鐘數）
  workflow_dispatch:
    inputs:
      only:
        description: "只建指定套件（逗號分隔，例：gcc,expect）；留空＝全量重建 91 包並發佈 feed"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  # ── 1. 掃描上游 → 動態產生 per-package matrix ───────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
      count: ${{ steps.matrix.outputs.count }}
      publishable: ${{ steps.matrix.outputs.publishable }}
    steps:
      - uses: actions/checkout@v7
      - name: 掃描上游並產生 per-package matrix
        id: matrix
        env:
          FORCE: ${{ inputs.force }}
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          # 預設全量重建 91 包；只有在 only 指定時才縮小範圍（驗證模式，不發佈）。
          if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); else args+=(--all); fi
          json=$(python3 ci/prepare-matrix.py "${args[@]}")
          echo "packages=$json" >> "$GITHUB_OUTPUT"
          count=$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$json")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          # --only 是驗證模式：只有兩三包，絕不能讓它覆寫掉完整 feed 的 db。
          if [ -n "${ONLY:-}" ]; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          fi
          echo "### 本次待建：$count 個套件" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. 一個 job 一個包：誰紅看誰，失敗可單獨 Re-run ──────────────────
  build:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    # 讓 Actions 矩陣 UI 直接顯示包名，而不是物件內容。
    name: "build ${{ matrix.pkg.name }} [${{ matrix.pkg.index }}/${{ matrix.pkg.total }}]"
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false        # 一包紅不拖垮其他 90 包
      max-parallel: 8         # 不同時開 91 個 runner，避免排隊
      matrix:
        pkg: ${{ fromJSON(needs.prepare.outputs.packages) }}
    steps:
      - name: 系統準備（multilib＋builder）
        run: |
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          # MLFS 配方有 32 位步驟（gcc -m32）；Arch 容器的 pacman.conf 不保證
          # 有 #[multilib] 註解區塊，原本的 sed 會靜默失效（#13 實錘：日誌只
          # 同步 core/extra，所有 multilib 套件都 target not found）。改為冪等附加。
          grep -q '^\[multilib\]' /etc/pacman.conf || \
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          # 宿主工具：PEP 517 後端（7 個 Python 配方 --no-build-isolation）、
          # multilib 32 位連結庫、libpipeline（man-db）、re2c（ninja）。
          pacman -Syu --noconfirm --needed \
            base-devel git curl jq python python-pip \
            python-flit-core python-setuptools python-wheel python-build python-installer \
            meson ninja tcl rsync pacman-contrib libpipeline re2c \
            lib32-glibc lib32-gcc-libs lib32-zlib lib32-zstd lib32-xz \
            lib32-ncurses lib32-pcre2 lib32-readline lib32-util-linux \
            lib32-bzip2 lib32-openssl github-cli
          useradd -m builder
      # checkout 需要容器內有 git，所以排在系統準備之後。
      - uses: actions/checkout@v7
      - name: 套用 znver3（64／32 位）＋ runner 探測
        run: |
          # ── 全 91 包開 LTO（硬幹模式）── makepkg 的 check_option() 對 "!lto" 優先；
          # PKGBUILD 的 !lto 會壓過 makepkg.conf 的 lto，所以兩邊的 !lto 都翻成 lto。
          # Arch 容器若 makepkg.conf 完全沒列 lto 再補 OPTIONS+=(lto)。
          # base toolchain 的 LTO 相容性由各包 PKGBUILD 自行處理（gcc→bootstrap-lto、
          # binutils→只關 gprofng、glibc→關 CET、grub/openssl→照吃全域 LTO）；
          # 任一包炸就單包修補丁，不再整包退回 !lto。
          sed -i 's/!lto/lto/g' /etc/makepkg.conf
          # glibc 例外：上游不支援 LTO，配方維持 !lto（證據與定案見手冊 §7.4 規則 16a）。
          for f in packages/*/PKGBUILD; do
            [ "$f" = packages/glibc/PKGBUILD ] && continue
            sed -i 's/!lto/lto/g' "$f"
          done
          grep -qE '^OPTIONS=\(.*lto' /etc/makepkg.conf || echo 'OPTIONS+=(lto)' >> /etc/makepkg.conf
          cat ci/makepkg-flags.conf >> /etc/makepkg.conf
          # ── LTO 相容性系統性修正（全 91 包共用）──
          # 1) LTO 延遲符號解析，--as-needed 據此把「有被用到」的 lib（如 tcl 的 libm）
          #    從 DT_NEEDED 剃掉，後續連結爆 undefined reference to sin/cos/exp/...。
          sed -i 's/,--as-needed//g; s/ --as-needed//g' /etc/makepkg.conf
          # 2) 部分套件（tcl 等）用到 libm 卻未顯式 -lm（其 configure 因 glibc libc
          #    已提供 sin/cos 誤判不需 -lm）。全域補 -lm，無害且修好整類。
          sed -i 's|^LDFLAGS="|LDFLAGS="-lm |' /etc/makepkg.conf
          # 編譯器外掛：連 Makefile 寫死 CFLAGS、硬寫 -march=i686 的配方也吃到。
          install -d /usr/local/bin
          install -m755 ci/gcc-znver3.sh /usr/local/bin/gcc-znver3
          for c in gcc g++ cc c++; do
            ln -sf /usr/local/bin/gcc-znver3 "/usr/local/bin/$c"
          done
          echo "### runner CPU（znver3 產物在建置期會被執行）" >> "$GITHUB_STEP_SUMMARY"
          grep -m1 '^model name' /proc/cpuinfo >> "$GITHUB_STEP_SUMMARY"
          for f in avx2 bmi2 fma f16c sha_ni vaes vpclmulqdq; do
            if grep -qm1 "^flags.* $f" /proc/cpuinfo; then
              echo "- $f: OK" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $f: MISSING（若建置期執行到該指令會 SIGILL）" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          printf 'int main(void){return 0;}\n' > /tmp/znver3-probe.c
          /usr/bin/gcc -march=znver3 -O2 /tmp/znver3-probe.c -o /tmp/znver3-probe
          /tmp/znver3-probe && echo "- znver3 probe: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "有效旗標："
          grep -E '^(CFLAGS|CXXFLAGS|LTOFLAGS)=' /etc/makepkg.conf | tail -3
          grep -E '^OPTIONS=' /etc/makepkg.conf | tail -1
          gcc -march=znver3 -dM -E - </dev/null | grep -m1 '__znver3__'
      - name: 取得預製 gcc（bootstrap-lto 在 4 核 runner 會超過 6 小時上限）
        # 2026-11-09：gcc 用 --with-build-config=bootstrap-lto 自舉，4 核 runner 實測
        # 4h40m 仍未完成（run 42562203613 被取消）。改由本機 12 核建好、發布成
        # current-mlfs-repo 的 release 資產，CI 直接取回入 feed（見手冊 §7.4 規則 16b）。
        if: matrix.pkg.name == 'gcc'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p packages/gcc
          # --repo 明確指定：container 內 gh 用 git 偵測倉庫會撞
          # "detected dubious ownership"（checkout 屬主與執行 uid 不同）。
          gh release download --repo "$GITHUB_REPOSITORY" current-mlfs-repo \
            --pattern 'gcc-16.2.0-*.pkg.tar.zst' --dir packages/gcc --clobber
          ls -la packages/gcc/*.pkg.tar.zst
      - name: 構建 ${{ matrix.pkg.name }}
        id: build
        if: matrix.pkg.name != 'gcc'
        env:
          PKG_NAME: ${{ matrix.pkg.name }}
          PKG_VERSION: ${{ matrix.pkg.version }}
        run: |
          chmod +x ci/build-recipe.sh ci/scan-updates.py ci/prepare-matrix.py
          mkdir -p /tmp/ci
          set -o pipefail
          # build-recipe.sh 保留原本的 patch 注入、updpkgsums、--nodeps --nocheck。
          ci/build-recipe.sh "$PKG_NAME" "$PKG_VERSION" 2>&1 | tee /tmp/ci/build.log
      - name: 上傳套件 artifact
        if: matrix.pkg.name == 'gcc' || steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.pkg.name }}
          path: packages/${{ matrix.pkg.name }}/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
          overwrite: true       # Re-run failed jobs 時同名 artifact 可覆寫
          compression-level: 0  # .pkg.tar.zst 已壓縮，別再壓一次
      - name: 上傳失敗日誌
        if: always() && matrix.pkg.name != 'gcc' && steps.build.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ matrix.pkg.name }}
          path: /tmp/ci/build.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: 記錄單包結果
        if: always()
        env:
          IDX: ${{ matrix.pkg.index }}
          TOTAL: ${{ matrix.pkg.total }}
          NAME: ${{ matrix.pkg.name }}
          OUTCOME: ${{ matrix.pkg.name == 'gcc' && 'prebuilt' || steps.build.outcome }}
        run: |
          mkdir -p results
          printf '%s\t%s\t%s\n' "$IDX" "$OUTCOME" "$NAME" > "results/$IDX-$NAME.tsv"
          {
            echo "## [$IDX/$TOTAL] $NAME"
            echo ""
            echo "- 結果：**$OUTCOME**"
            if [ "$OUTCOME" != "success" ]; then
              echo "- 失敗日誌 artifact：\`log-$NAME\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 上傳單包結果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.pkg.name }}
          path: results/*.tsv
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # ── 3. 全部綠才發 feed（避免半套 feed） ──────────────────────────────
  publish:
    needs: [prepare, build]
    # --only 驗證模式不發 feed，避免兩包就把完整 mlfs-core.db 覆寫掉。
    if: needs.build.result == 'success' && needs.prepare.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    steps:
      - name: 系統準備（repo-add／gh）
        run: |
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed git coreutils pacman pacman-contrib github-cli
      - uses: actions/checkout@v7
      - name: 下載全部套件 artifact
        uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: feed
          merge-multiple: true
      - name: 合併成 feed 併發佈 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p feed
          ( cd feed && repo-add mlfs-core.db.tar.zst *.pkg.tar.zst )
          sha256sum feed/*.pkg.tar.zst > feed/SHA256SUMS
          # release 不一定已存在；只 upload 會 404（2026-11-08 實錘：0 個 release）
          gh release view current-mlfs-repo >/dev/null 2>&1 || \
            gh release create current-mlfs-repo --title 'MLFS core feed' \
              --notes 'feed-bot 自動發佈（mlfs-core）' --latest=false
          gh release upload current-mlfs-repo \
            feed/mlfs-core.db.tar.zst feed/*.pkg.tar.zst feed/SHA256SUMS --clobber
          gh release upload current-mlfs-repo feed/mlfs-core.files.tar.zst --clobber 2>/dev/null || true

  # ── 4. 總表：不管成功失敗都產出，保留原本的 job summary ──────────────
  summary:
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 下載各包結果
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: 產出總表
        run: |
          {
            echo "## feed-bot 進度"
            echo ""
            echo "total: **${{ needs.prepare.outputs.count }}** packages ／ build: **${{ needs.build.result }}** ／ publishable: **${{ needs.prepare.outputs.publishable }}**"
            echo ""
            echo "| # | result | package |"
            echo "|---|---|---|"
            if compgen -G 'results/*.tsv' > /dev/null; then
              sort -n results/*.tsv | awk -F'\t' '{printf "| %s | %s | %s |\n", $1, toupper($2), $3}'
            else
              echo "| - | 無結果 | - |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
