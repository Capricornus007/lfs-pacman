name: feed-bot（掃描新版本 → CI 重建 → 入 feed，用戶端只需 pacman -Syu）

on:
  schedule:
    - cron: "30 1 * * *"   # 每日 09:30 UTC+8
  workflow_dispatch:
    inputs:
      force:
        description: "忽略偵測，全量重建 91 配方"
        type: boolean
        default: false
      only:
        description: "只建指定套件（逗號分隔，例：gcc,expect）；留空＝依掃描結果"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  # ── 1. 掃描上游 → 動態產生 per-package matrix ───────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
      count: ${{ steps.matrix.outputs.count }}
      publishable: ${{ steps.matrix.outputs.publishable }}
    steps:
      - uses: actions/checkout@v7
      - name: 掃描上游並產生 per-package matrix
        id: matrix
        env:
          FORCE: ${{ inputs.force }}
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          if [ "${FORCE:-}" = "true" ]; then args+=(--all); fi
          if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); fi
          json=$(python3 ci/prepare-matrix.py "${args[@]}")
          echo "packages=$json" >> "$GITHUB_OUTPUT"
          count=$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$json")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          # --only 是驗證模式：只有兩三包，絕不能讓它覆寫掉完整 feed 的 db。
          if [ -n "${ONLY:-}" ]; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          fi
          echo "### 本次待建：$count 個套件" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. 一個 job 一個包：誰紅看誰，失敗可單獨 Re-run ──────────────────
  build:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false        # 一包紅不拖垮其他 90 包
      max-parallel: 8         # 不同時開 91 個 runner，避免排隊
      matrix:
        pkg: ${{ fromJSON(needs.prepare.outputs.packages) }}
    steps:
      - name: 系統準備（multilib＋builder）
        run: |
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          # MLFS 配方有 32 位步驟（gcc -m32）；Arch 容器預設沒開 multilib。
          sed -i '/^#\[multilib\]/,/^#Include = \/etc\/pacman.d\/mirrorlist/ s/^#//' /etc/pacman.conf
          pacman -Syu --noconfirm --needed base-devel git curl jq python python-pip meson ninja tcl rsync pacman-contrib lib32-glibc lib32-gcc-libs
          useradd -m builder
      # checkout 需要容器內有 git，所以排在系統準備之後。
      - uses: actions/checkout@v7
      - name: 構建 ${{ matrix.pkg.name }}
        id: build
        env:
          PKG_NAME: ${{ matrix.pkg.name }}
          PKG_VERSION: ${{ matrix.pkg.version }}
        run: |
          chmod +x ci/build-recipe.sh ci/scan-updates.py ci/prepare-matrix.py
          mkdir -p /tmp/ci
          set -o pipefail
          # build-recipe.sh 保留原本的 patch 注入、updpkgsums、--nodeps --nocheck。
          ci/build-recipe.sh "$PKG_NAME" "$PKG_VERSION" 2>&1 | tee /tmp/ci/build.log
      - name: 上傳套件 artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.pkg.name }}
          path: packages/${{ matrix.pkg.name }}/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
          overwrite: true       # Re-run failed jobs 時同名 artifact 可覆寫
          compression-level: 0  # .pkg.tar.zst 已壓縮，別再壓一次
      - name: 上傳失敗日誌
        if: always() && steps.build.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ matrix.pkg.name }}
          path: /tmp/ci/build.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: 記錄單包結果
        if: always()
        env:
          IDX: ${{ matrix.pkg.index }}
          TOTAL: ${{ matrix.pkg.total }}
          NAME: ${{ matrix.pkg.name }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p results
          printf '%s\t%s\t%s\n' "$IDX" "$OUTCOME" "$NAME" > "results/$IDX-$NAME.tsv"
          {
            echo "## [$IDX/$TOTAL] $NAME"
            echo ""
            echo "- 結果：**$OUTCOME**"
            if [ "$OUTCOME" != "success" ]; then
              echo "- 失敗日誌 artifact：\`log-$NAME\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 上傳單包結果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.pkg.name }}
          path: results/*.tsv
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # ── 3. 全部綠才發 feed（避免半套 feed） ──────────────────────────────
  publish:
    needs: [prepare, build]
    # --only 驗證模式不發 feed，避免兩包就把完整 mlfs-core.db 覆寫掉。
    if: needs.build.result == 'success' && needs.prepare.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    steps:
      - name: 系統準備（repo-add／gh）
        run: |
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed git coreutils pacman pacman-contrib github-cli
      - uses: actions/checkout@v7
      - name: 下載全部套件 artifact
        uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: feed
          merge-multiple: true
      - name: 合併成 feed 併發佈 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p feed
          ( cd feed && repo-add mlfs-core.db.tar.zst *.pkg.tar.zst )
          sha256sum feed/*.pkg.tar.zst > feed/SHA256SUMS
          # release 不一定已存在；只 upload 會 404（2026-11-08 實錘：0 個 release）
          gh release view current-mlfs-repo >/dev/null 2>&1 || \
            gh release create current-mlfs-repo --title 'MLFS core feed' \
              --notes 'feed-bot 自動發佈（mlfs-core）' --latest=false
          gh release upload current-mlfs-repo \
            feed/mlfs-core.db.tar.zst feed/*.pkg.tar.zst feed/SHA256SUMS --clobber
          gh release upload current-mlfs-repo feed/mlfs-core.files.tar.zst --clobber 2>/dev/null || true

  # ── 4. 總表：不管成功失敗都產出，保留原本的 job summary ──────────────
  summary:
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 下載各包結果
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: 產出總表
        run: |
          {
            echo "## feed-bot 進度"
            echo ""
            echo "total: **${{ needs.prepare.outputs.count }}** packages ／ build: **${{ needs.build.result }}** ／ publishable: **${{ needs.prepare.outputs.publishable }}**"
            echo ""
            echo "| # | result | package |"
            echo "|---|---|---|"
            if compgen -G 'results/*.tsv' > /dev/null; then
              sort -n results/*.tsv | awk -F'\t' '{printf "| %s | %s | %s |\n", $1, toupper($2), $3}'
            else
              echo "| - | 無結果 | - |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
